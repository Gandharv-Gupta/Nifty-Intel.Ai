<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nifty — Intel Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <style>
      :root {
        --bg-deep: #0a0e14;
        --bg-panel: #121820;
        --bg-elevated: #1a222d;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8edf4;
        --text-muted: #8b98a8;
        --accent: #3dd6c6;
        --accent-dim: rgba(61, 214, 198, 0.15);
        --user-bubble: #243044;
        --danger: #f87171;
        --radius: 14px;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg-deep);
        color: var(--text);
        line-height: 1.55;
      }

      .bg-grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(61, 214, 198, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(61, 214, 198, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black, transparent);
        pointer-events: none;
        z-index: 0;
      }

      .shell {
        position: relative;
        z-index: 1;
        max-width: 880px;
        margin: 0 auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 1.25rem 1rem 1.5rem;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #2a9d8f);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--bg-deep);
        box-shadow: 0 8px 24px rgba(61, 214, 198, 0.35);
      }

      .brand h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 0;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .api-field {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .api-field input {
        width: min(240px, 40vw);
        padding: 0.45rem 0.65rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-panel);
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
      }

      .api-field input:focus {
        outline: 2px solid var(--accent-dim);
        border-color: rgba(61, 214, 198, 0.35);
      }

      .thread {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .msg {
        max-width: 92%;
        animation: fadeUp 0.35s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg.user {
        align-self: flex-end;
      }

      .msg.assistant {
        align-self: flex-start;
        width: 100%;
      }

      .bubble {
        border-radius: var(--radius);
        padding: 0.85rem 1.1rem;
        box-shadow: var(--shadow);
      }

      .msg.user .bubble {
        background: var(--user-bubble);
        border: 1px solid var(--border);
        border-bottom-right-radius: 4px;
      }

      .msg.assistant .bubble {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      .msg.user .bubble {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .content {
        font-size: 0.95rem;
      }

      .table-pending {
        margin: 0.75rem 0 0;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        background: var(--accent-dim);
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .content :first-child {
        margin-top: 0;
      }

      .content :last-child {
        margin-bottom: 0;
      }

      .content h1,
      .content h2,
      .content h3 {
        margin: 1.1em 0 0.5em;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .content h1 {
        font-size: 1.35rem;
      }
      .content h2 {
        font-size: 1.15rem;
      }
      .content h3 {
        font-size: 1.02rem;
      }

      .content p {
        margin: 0.65em 0;
      }

      .content ul,
      .content ol {
        margin: 0.65em 0;
        padding-left: 1.35rem;
      }

      .content li {
        margin: 0.25em 0;
      }

      .content a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .content blockquote {
        margin: 0.75em 0;
        padding: 0.5rem 0 0.5rem 1rem;
        border-left: 3px solid var(--accent);
        background: var(--accent-dim);
        border-radius: 0 8px 8px 0;
        color: var(--text-muted);
      }

      .content code {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.86em;
        padding: 0.15em 0.4em;
        border-radius: 6px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
      }

      .content pre {
        margin: 0.85em 0;
        padding: 1rem 1.1rem;
        border-radius: 10px;
        background: #0d1117;
        border: 1px solid var(--border);
        overflow-x: auto;
      }

      .content pre code {
        background: none;
        border: 0;
        padding: 0;
        font-size: 0.82rem;
        line-height: 1.5;
      }

      /* Markdown + HTML tables */
      .content .table-wrap {
        margin: 1rem 0;
        border-radius: 10px;
        border: 1px solid var(--border);
        overflow: hidden;
        background: var(--bg-elevated);
      }

      .content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }

      .content thead {
        background: rgba(61, 214, 198, 0.08);
      }

      .content th,
      .content td {
        padding: 0.55rem 0.75rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      .content th {
        font-weight: 600;
        color: var(--text);
      }

      .content tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.02);
      }

      .content tbody tr:last-child td {
        border-bottom: none;
      }

      .content hr {
        border: none;
        height: 1px;
        background: var(--border);
        margin: 1.25rem 0;
      }

      .composer {
        margin-top: auto;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
      }

      .composer-inner {
        display: flex;
        gap: 0.65rem;
        align-items: flex-end;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.55rem 0.65rem;
        box-shadow: var(--shadow);
      }

      .composer textarea {
        flex: 1;
        resize: none;
        min-height: 44px;
        max-height: 160px;
        border: none;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 0.95rem;
        line-height: 1.45;
        padding: 0.4rem 0.35rem;
      }

      .composer textarea:focus {
        outline: none;
      }

      .composer textarea::placeholder {
        color: var(--text-muted);
      }

      .send {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), #2a9d8f);
        color: var(--bg-deep);
        display: grid;
        place-items: center;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .send:hover:not(:disabled) {
        transform: scale(1.04);
      }

      .send:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .send svg {
        width: 20px;
        height: 20px;
      }

      .hint {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
        text-align: center;
      }

      .error-banner {
        padding: 0.65rem 1rem;
        border-radius: 10px;
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid rgba(248, 113, 113, 0.35);
        color: var(--danger);
        font-size: 0.88rem;
        margin-bottom: 0.75rem;
      }

      .typing-dot {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        padding: 0.25rem 0;
      }

      .typing-dot span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: bounce 1.2s infinite ease-in-out;
      }

      .typing-dot span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-dot span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0.65);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 520px) {
        .api-field {
          width: 100%;
        }
        .api-field input {
          flex: 1;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="shell">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true">N</div>
          <div>
            <h1>Nifty Intel</h1>
            <p>Markdown, tables &amp; HTML — streamed from your API</p>
          </div>
        </div>
        <label class="api-field">
          <span>API base</span>
          <input
            id="apiBase"
            type="text"
            spellcheck="false"
            placeholder="(same origin)"
            title="Leave empty when this page is served from the API host (e.g. localhost:8000)"
          />
        </label>
      </header>

      <div id="error" class="error-banner" hidden></div>

      <main id="thread" class="thread" aria-live="polite"></main>

      <footer class="composer">
        <div class="composer-inner">
          <textarea
            id="input"
            rows="1"
            placeholder="Ask Nifty anything…"
            maxlength="32000"
            aria-label="Message"
          ></textarea>
          <button type="button" class="send" id="send" title="Send (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </div>
        <p class="hint">
          Enter to send · Shift+Enter for a new line · Open this app at
          <code>/nifty/</code> on your API host · POST <code>/chat</code> (SSE)
        </p>
      </footer>
    </div>

    <script>
      (function () {
        const thread = document.getElementById("thread");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const apiBaseInput = document.getElementById("apiBase");
        const errorEl = document.getElementById("error");

        marked.setOptions({
          gfm: true,
          breaks: true,
        });

        const PURIFY_HTML = {
          USE_PROFILES: { html: true },
          ADD_ATTR: ["colspan", "rowspan", "align"],
        };

        function lastOpenTableIndex(buf) {
          const re = /<table\b/gi;
          let idx = -1;
          let m;
          while ((m = re.exec(buf)) !== null) idx = m.index;
          return idx;
        }

        function splitMarkdownAndTables(s) {
          const re = /<table\b[\s\S]*?<\/table>/gi;
          const out = [];
          let last = 0;
          let m;
          while ((m = re.exec(s)) !== null) {
            if (m.index > last) out.push({ type: "md", text: s.slice(last, m.index) });
            out.push({ type: "html", text: m[0] });
            last = re.lastIndex;
          }
          if (last < s.length) out.push({ type: "md", text: s.slice(last) });
          return out;
        }

        /**
         * Stream-friendly: markdown for text chunks; only emit complete <table>...</table>.
         * If the final <table> is still open, cut before it and show a placeholder (no raw tags).
         */
        function streamingHtmlFrom(assembled) {
          const buf = assembled || "";
          const openIdx = lastOpenTableIndex(buf);
          let safe = buf;
          let pending = false;
          if (openIdx !== -1) {
            const tail = buf.slice(openIdx);
            if (!/<\/table>/i.test(tail)) {
              safe = buf.slice(0, openIdx);
              pending = true;
            }
          }
          let html = "";
          for (const part of splitMarkdownAndTables(safe)) {
            if (part.type === "html") {
              html += DOMPurify.sanitize(part.text, PURIFY_HTML);
            } else if (part.text) {
              html += DOMPurify.sanitize(marked.parse(part.text, { async: false }), PURIFY_HTML);
            }
          }
          if (pending) {
            html += '<p class="table-pending">Building table…</p>';
          }
          return html;
        }

        function createStreamPainter(contentEl) {
          let raf = null;
          let latest = "";

          function flush() {
            raf = null;
            contentEl.innerHTML = streamingHtmlFrom(latest);
            enhanceTables(contentEl);
            thread.scrollTop = thread.scrollHeight;
          }

          function paint(assembled) {
            latest = assembled;
            if (raf == null) raf = requestAnimationFrame(flush);
          }

          paint.sync = function (assembled) {
            latest = assembled;
            if (raf != null) {
              cancelAnimationFrame(raf);
              raf = null;
            }
            flush();
          };

          return paint;
        }

        /** Wrap raw <table>… in a scroll container after parse */
        function enhanceTables(root) {
          root.querySelectorAll("table").forEach((table) => {
            if (table.parentElement && table.parentElement.classList.contains("table-wrap")) return;
            const wrap = document.createElement("div");
            wrap.className = "table-wrap";
            table.replaceWith(wrap);
            wrap.appendChild(table);
          });
        }

        function showError(msg) {
          if (!msg) {
            errorEl.hidden = true;
            errorEl.textContent = "";
            return;
          }
          errorEl.hidden = false;
          errorEl.textContent = msg;
        }

        function appendUser(text) {
          const wrap = document.createElement("div");
          wrap.className = "msg user";
          wrap.innerHTML =
            '<div class="bubble">' +
            escapeHtml(text) +
            "</div>";
          thread.appendChild(wrap);
          thread.scrollTop = thread.scrollHeight;
        }

        function escapeHtml(s) {
          const d = document.createElement("div");
          d.textContent = s;
          return d.innerHTML;
        }

        function appendAssistantShell() {
          const wrap = document.createElement("div");
          wrap.className = "msg assistant";
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          const content = document.createElement("div");
          content.className = "content";
          content.innerHTML =
            '<span class="typing-dot" aria-label="Thinking"><span></span><span></span><span></span></span>';
          bubble.appendChild(content);
          wrap.appendChild(bubble);
          thread.appendChild(wrap);
          thread.scrollTop = thread.scrollHeight;
          return { wrap, bubble, content };
        }

        function apiBase() {
          const v = (apiBaseInput.value || "").trim().replace(/\/$/, "");
          return v;
        }

        function parseSseBlock(block, onEvent) {
          for (const line of block.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const jsonStr = line.slice(5).trim();
            if (!jsonStr) continue;
            let data;
            try {
              data = JSON.parse(jsonStr);
            } catch {
              continue;
            }
            onEvent(data);
          }
        }

        async function streamChat(query, onDelta) {
          const base = apiBase();
          const url = (base || "") + "/chat";
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
            body: JSON.stringify({ query }),
          });

          if (!res.ok) {
            const t = await res.text().catch(() => "");
            throw new Error(t || "Request failed (" + res.status + ")");
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let assembled = "";

          function consumeEvents(text) {
            let sep;
            while ((sep = text.indexOf("\n\n")) !== -1) {
              const block = text.slice(0, sep);
              text = text.slice(sep + 2);
              parseSseBlock(block, (data) => {
                if (typeof data.content === "string") {
                  assembled += data.content;
                  if (onDelta) onDelta(assembled);
                }
                if (data.error) throw new Error(data.error);
              });
            }
            return text;
          }

          while (true) {
            const { done, value } = await reader.read();
            if (value) buffer += decoder.decode(value, { stream: true });
            buffer = consumeEvents(buffer);
            if (done) break;
          }

          if (buffer.trim()) {
            parseSseBlock(buffer, (data) => {
              if (typeof data.content === "string") {
                assembled += data.content;
                if (onDelta) onDelta(assembled);
              }
              if (data.error) throw new Error(data.error);
            });
          }

          return assembled;
        }

        let busy = false;

        async function submit() {
          const text = input.value.trim();
          if (!text || busy) return;

          busy = true;
          sendBtn.disabled = true;
          showError("");
          appendUser(text);
          input.value = "";
          input.style.height = "auto";

          const { content } = appendAssistantShell();
          const paint = createStreamPainter(content);

          try {
            const reply = await streamChat(text, paint);
            content.style.color = "";
            if (!reply.trim()) {
              content.textContent = "No text in response.";
              content.style.color = "var(--text-muted)";
            } else {
              paint.sync(reply);
            }
          } catch (e) {
            content.innerHTML =
              '<p style="color:var(--danger);margin:0">' +
              escapeHtml(e.message || String(e)) +
              "</p>";
            showError(e.message || String(e));
          } finally {
            busy = false;
            sendBtn.disabled = false;
            thread.scrollTop = thread.scrollHeight;
            input.focus();
          }
        }

        sendBtn.addEventListener("click", submit);
        input.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" && !ev.shiftKey) {
            ev.preventDefault();
            submit();
          }
        });

        input.addEventListener("input", () => {
          input.style.height = "auto";
          input.style.height = Math.min(input.scrollHeight, 160) + "px";
        });
      })();
    </script>
  </body>
</html>
